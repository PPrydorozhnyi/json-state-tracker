name: CI

on:
  push:
    # Bot commits of the state file must not trigger CI.
    paths-ignore:
      - 'last_response.json'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint (includes formatter checks)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # ./... also proves the cmd/ helper scripts still compile.
      - name: Vet and test
        run: go vet ./... && go test -race ./...
